# garbg default configuration
# Location: ~/.config/garbg/config.toml
# See https://github.com/gardesk/garbg for documentation

[general]
mode = "fill"

# Default wallpaper (loaded on daemon start)
[default]
source = "~/Pictures/background/"
mode = "fill"
shuffle = true

[cache]
max_size_mb = 1024
max_age_days = 30
