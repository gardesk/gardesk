# Nginx config for gar.musicsian.com
# Copy to /etc/nginx/conf.d/gar.musicsian.com.conf
# Then run: sudo certbot --nginx -d gar.musicsian.com

server {
    server_name gar.musicsian.com;
    root /var/www/gar.musicsian.com/current;
    index index.html;

    access_log /var/log/nginx/gar.musicsian.access.log;
    error_log  /var/log/nginx/gar.musicsian.error.log;

    # gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Astro hashed assets - long cache
    location /_astro/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static assets
    location /images/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Favicon
    location /favicon.svg {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback for clean URLs
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    listen 80;
    listen [::]:80;
}
